<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evaluaciones</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#dfe3e8;--pri:#2f6fed;--ok:#1f9d55;--bad:#d64545;--okbg:#e6f6ec;--badbg:#fbe9e9}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mut:#95a0ac;--bd:#2d333b;--pri:#6c9bff;--ok:#4cc27f;--bad:#ef7a7a;--okbg:#17301f;--badbg:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
main{max-width:800px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
#user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
h1{font-size:1.3rem;margin:0}h2{font-size:1.1rem;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto}
button{font:inherit;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 16px;border-radius:10px;cursor:pointer;touch-action:manipulation}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
button.del{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{resize:vertical}
input[type=radio]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--pri)}
label.opt{display:flex;gap:12px;align-items:center;padding:12px;min-height:48px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;cursor:pointer}
label.opt.ok{background:var(--okbg);border-color:var(--ok)}label.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opts{display:flex;gap:8px;align-items:center;margin:8px 0}
.opts input[type=text]{flex:1;min-width:0}
.score{font-size:3rem;font-weight:700;text-align:center}.good{color:var(--ok)}.low{color:var(--bad)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
.tag{font-size:.85rem;padding:2px 10px;border-radius:99px;border:1px solid var(--bd)}
.err{color:var(--bad)}.center{text-align:center}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:520px;border-collapse:collapse;font-size:.9rem}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;overflow-wrap:normal}

.pic{display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin:8px 0}
.qpic{max-height:340px}
.optgrid.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.optgrid.pics label.opt{flex-direction:column;align-items:stretch;margin:0;text-align:center}
.optgrid.pics label.opt input[type=radio]{align-self:flex-start}
.optgrid.pics .pic{max-height:170px;margin:0 auto}
.optedit{margin-bottom:6px}
.prev{display:flex;align-items:center;gap:10px;margin:4px 0 8px;flex-wrap:wrap}
.thumb{height:72px;max-width:140px;object-fit:contain;border-radius:6px;border:1px solid var(--bd)}
input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--pri)}
/* Tablet */
@media (min-width:700px){
  body{font-size:17px}
  main{padding-top:max(24px,env(safe-area-inset-top))}
  .card{padding:18px}
}
/* Celular */
@media (max-width:600px){
  h1{font-size:1.15rem}
  .score{font-size:2.6rem}
  .row>button{flex:1 1 auto}
  .row>div:last-child:has(button){display:flex;gap:8px;flex:1 1 100%}
  .row>div:last-child:has(button) button{flex:1}
}
</style>
</head>
<body>
<main>
  <header><h1>📝 Evaluaciones</h1><div id="user"></div></header>
  <nav id="nav"></nav>
  <div id="app"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
