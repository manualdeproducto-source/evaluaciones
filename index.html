<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluaciones</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#dfe3e8;--pri:#2f6fed;--ok:#1f9d55;--bad:#d64545;--okbg:#e6f6ec;--badbg:#fbe9e9}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mut:#95a0ac;--bd:#2d333b;--pri:#6c9bff;--ok:#4cc27f;--bad:#ef7a7a;--okbg:#17301f;--badbg:#3a1d1d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.3rem;margin:0}h2{font-size:1.1rem;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.on{border-color:var(--pri);color:var(--pri);font-weight:600}
button.del{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut);font-size:.9rem}
input[type=text],textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label.opt{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.opt.ok{background:var(--okbg);border-color:var(--ok)}label.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opts{display:flex;gap:8px;align-items:center;margin:6px 0}
.score{font-size:3rem;font-weight:700;text-align:center}.good{color:var(--ok)}.low{color:var(--bad)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar>div{height:100%;background:var(--pri)}
.tag{font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.err{color:var(--bad)}.center{text-align:center}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<main>
  <header><h1>📝 Evaluaciones</h1><div id="user"></div></header>
  <nav id="nav"></nav>
  <div id="app"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
